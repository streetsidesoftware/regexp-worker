on:
  push:
    branches:
      - main
  workflow_dispatch:

name: release-please

permissions:
  actions: read
  checks: write
  contents: write
  issues: read
  packages: write
  pull-requests: write
  repository-projects: read
  statuses: read

jobs:
  release-please:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    steps:
      # A token from the automation app, so the release PR and the version tags start other workflows.
      # The version tag starts publish.yml.
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
